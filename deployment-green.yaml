apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green-app
      version: green
  template:
    metadata:
      labels:
        app: blue-green-app
        version: green
    spec:
      containers:
        - name: web-app
          image: us-west4-docker.pkg.dev/public-cloud1-509700/blue-green-repo/blue-green-app-green:latest
          ports:
            - containerPort: 80
